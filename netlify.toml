# Legal pages (clean URLs). Must come before the catch-all below.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Public live scores page (clean URLs). Must come before the catch-all below.
[[redirects]]
  from = "/live"
  to = "/live.html"
  status = 200

[[redirects]]
  from = "/live/*"
  to = "/live.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # index.html contains the public Firebase web apiKey (an identifier, not a
  # credential). Keep it from tripping Netlify's secret scan.
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
